# Node metadata for `Richstein2001.v1`.  See docs/NODES.md.
version: "v0.4"

node:
  id: Richstein2001.v1
  family: Richstein2001
  version: v1
  kind: computation
  status: active

project:
  name: "Richstein's verification of the even Goldbach conjecture"
  description: >-
    Every even integer between 4 and 4 x 10^14 is a sum of two primes, verified by computation in
    2001. Superseded in range by Oliveira e Silva, Herzog and Pardi's verification to 4 x 10^18,
    and recorded separately because the Ramare-Saouter height for the odd Goldbach conjecture was
    derived from this one.
  authors: ["Terence Tao"]
  license: "Apache-2.0"
  responsible_maintainers: ["Terence Tao"]

repository:
  role: substantive-development

classification:
  arxiv: [math.NT]
  msc2020: ["11P32", "11Y11"]

conclusions:
- id: even_up_to_4e14
  declaration: Richstein2001.v1.even_up_to_4e14
  challenge: Richstein2001.v1.challenge_even_up_to_4e14
  imports: []
  imports_status: none
  justifications:
  - id: richstein-computation
    kind: numerical
    source: richstein
    locator: the paper's main result, stated in its title and abstract
    note: >-
      A computation, not a proof: the paper reports an exhaustive machine verification over the
      even integers below 4 x 10^14. Nothing in this network checks it, and nothing can -- the
      result is the output of a program run in 2001. It is recorded on the authority of the paper
      and its publication in Mathematics of Computation.
  designated: richstein-computation

sources:
- title: "Verifying the Goldbach conjecture up to 4 x 10^14"
  authors: ["Joerg Richstein"]
  type: "paper"
  id: "https://doi.org/10.1090/S0025-5718-00-01290-4"
  location: "Math. Comp. 70 (2001), no. 236, 1745-1749"
  relationship: formalizes
  note: >-
    The DOI was confirmed against Crossref, which records the article under Mathematics of
    Computation 70, pages 1745-1749; Crossref dates the electronic publication to 2000 and the
    print issue is 70 (2001), no. 236. The paper itself is not held in this repository's library,
    so the statement is transcribed from PrimeNumberTheoremAnd's transcription of it rather than
    read from the source.

related_formalizations:
- id: "https://github.com/AlexKontorovich/PrimeNumberTheoremAnd"
  relationship: builds-on
  note: >-
    PNT+ states this as `Goldbach.richstein_goldbach`, with a `sorry`, and uses it to derive the
    Ramare-Saouter odd-Goldbach height. This node is that statement, transcribed into the
    network's vocabulary.

automation:
  methods:
  - method: agent
    models: ["Claude Opus 5 (Anthropic)"]
    framework: "Claude Code"
    role: >-
      Transcribed the statement and wrote this metadata under the direction of the maintainer, and
      confirmed the bibliographic record against Crossref. The computation is Richstein's.

review:
  status: self-assessed
  reviewers: ["Terence Tao"]
  notes: >-
    Statement taken from PNT+ rather than from the paper, which the library does not hold. What
    can be checked without it -- the authors, title, journal, volume and pages -- was checked
    against Crossref.

limitations:
- >-
  A computation recorded on citation. The verification cannot be rerun here and is not checked by
  anything in this network; a consumer trusts Richstein and the referees of Math. Comp.
- >-
  Superseded in range. OliveiraESilva2014.v1 reaches 4 x 10^18, ten thousand times further, and
  anything wanting the best available bound should import that instead.
- >-
  The source is not in the library. docs/SOURCES.md records it as wanted; until then the statement
  rests on PNT+'s transcription.
