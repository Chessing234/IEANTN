      Statement drafting and Lean proof development, reviewed by the contributor before commit.

review:
  status: self-assessed
  reviewers: []

limitations:
- >-
  Excludes the prime_gap_record route the issue also surveys: IEANTN's Vocabulary does not yet
  have a prime-gap-record predicate, so it is left for a follow-up node rather than stated here
  against an ad hoc local definition.
