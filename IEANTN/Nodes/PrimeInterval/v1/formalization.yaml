# Node metadata for `PrimeInterval.v1`.  See docs/NODES.md.
version: "v0.4"

node:
  id: PrimeInterval.v1
  family: PrimeInterval
  version: v1
  kind: pipeline
  status: active

project:
  name: "PrimeInterval.v1"
  description: >-
    A pipeline node carrying a bound on the normalised error term Eθ to the existence of a prime
    in a short interval (x, x + h]. States the θ characterisation of a prime in a short interval,
    the Eθ criterion it is proved through, and the numerical- and classical-bound routes that
    consume an Eθ bound however it was itself justified. Every conclusion imports nothing: all
    inputs arrive as hypotheses, so the node can sit downstream of a bound-producing node such as
    FKS2 without importing or reproving that node's proof.
  authors: ["Sebastian Rodrigo"]
  license: "Apache-2.0"
  responsible_maintainers: ["Sebastian Rodrigo"]

