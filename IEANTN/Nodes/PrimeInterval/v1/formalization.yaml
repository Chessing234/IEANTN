sources:
- title: "PrimeInInterval.lean"
  authors: ["Alex Kontorovich"]
  type: "other"
  id: "PrimeNumberTheoremAnd/IEANTN/PrimeInInterval.lean"
  relationship: adapts
  note: >-
    275 lines, 7 results, 0 sorry in PrimeNumberTheoremAnd; used as inspiration for the
    statement shapes and proof strategy, not ported. PNT+'s HasPrimeInInterval has the same
    proposition and endpoint convention. Specialising IEANTN.HasClassicalBound to Eθ gives the
    same inequality shape as PNT+'s Eθ.classicalBound; Eθ and admissibleBound use the same
    formulae and argument order. The numerical-bound APIs differ: IEANTN.HasNumericalBound takes
    a constant ε : ℝ, whereas PNT+'s Eθ.numericalBound takes ε : ℝ → ℝ and uses ε x₀.

automation:
  methods:
