sources:
- title: "From a verification of even Goldbach to a range for odd Goldbach"
  authors: ["folklore"]
  type: "folklore"
  id: "goldbach-even-to-odd"
  relationship: formalizes
  note: >-
    The reduction is standard and is used wherever a finite odd-Goldbach range is quoted -- by
    Ramare and Saouter, by Helfgott, by Kadiri and Lumley -- without any of them being its source.
    The `folklore` type is used in the sense the schema allows rather than the usual one, as
    ContourIntegration.v1 and CotangentSeries.v1 also do: this is not an unproved claim circulating
    in the literature but an argument everybody in the area writes down when they need it. The
    particular form here follows PrimeNumberTheoremAnd's.

- title: "The ternary Goldbach conjecture is true"
  authors: ["Harald Andres Helfgott"]
  type: "paper"
  id: "arXiv:1312.7748"
  location: "arXiv:1312.7748, Appendix C"
  relationship: background
  note: >-
    States a finite odd-Goldbach range of the size `odd_up_to_1_1325e26` records, by this method,
    and then goes further using unpublished estimates of Ramare which are not reproduced here or in
    PrimeNumberTheoremAnd. Recorded as background because nothing in this node depends on it: the
    range is derived from the imports, not taken from the paper.

related_formalizations:
- id: "https://github.com/AlexKontorovich/PrimeNumberTheoremAnd"
  relationship: builds-on
  note: >-
    PrimeNumberTheoremAnd/IEANTN/Goldbach.lean is where this comes from, and the solution is a port
    of it. Two differences. Its two verification statements carry `sorry` and are nodes here, which
    is what lets the rest be verified. And its extension of the 4 x 10^18 verification to
    4 x 10^18 + 4, which needs Pocklington certificates from the external `PrimeCert` package, is
    not ported; the Kadiri-Lumley range is stated from 4 x 10^18 instead, which costs a relative
    10^-18.

automation:
  methods:
  - method: agent
    models: ["Claude Opus 5 (Anthropic)"]
    framework: "Claude Code"
    role: >-
      Ported the development from PrimeNumberTheoremAnd under the direction of the maintainer:
      transcribed the conclusions into this network's vocabulary, split the two computations out as
      their own nodes, replaced the LeanCert-backed numeric steps with proofs from Mathlib, and
      dropped the part resting on an external primality package. The mathematics and the original
      Lean are PNT+'s.

review:
  status: self-assessed
  reviewers: ["Terence Tao"]
  notes: >-
    Statements transcribed from the PNT+ development. The three ranges were recomputed here rather
    than copied: the Ramare-Saouter number 11325599999999886744004 is exactly
    (4 x 10^14 - 4) * 28314000 + 4, which matches PNT+'s literal, and the Kadiri-Lumley one differs
    from PNT+'s deliberately, as recorded above.

limitations:
- >-
  Nothing here is a case of the Goldbach conjecture that was not already known. The content is the
  conversion: what it buys is that a better even verification, or a narrower prime interval, gives
  a better odd range by re-instantiating rather than by re-arguing.
- >-
  Three of the six conclusions are conditional, on two computations that no kernel checks and two
  papers the library does not hold. A consumer of the ranges trusts Richstein, Oliveira e Silva et
  al., Ramare-Saouter and Kadiri-Lumley exactly as far as their own nodes say.
- >-
  The Kadiri-Lumley range stops just short of PNT+'s, by design: the four integers above 4 x 10^18
  need an external primality package. Recovering them means writing the two Pocklington arguments
  by hand against Mathlib, which is a well-posed and self-contained task.
- >-
  No novelty is claimed. The reduction is standard and the Lean is a port.
