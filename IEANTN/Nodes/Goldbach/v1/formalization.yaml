# Node metadata for `Goldbach.v1`.  See docs/NODES.md.
#
# The node where the Goldbach material is actually proved. Three conclusions import nothing and are
# theorems about the predicates; three import the verification and prime-gap nodes and are the
# arithmetic of instantiating the second of them.
version: "v0.4"

node:
  id: Goldbach.v1
  family: Goldbach
  version: v1
  kind: paper
  status: awaiting-verification

project:
  name: "From even Goldbach to odd Goldbach"
  description: >-
    The reductions converting a verification of the even Goldbach conjecture into a verified range
    for the odd one, and the three ranges that follow from the computations and prime-gap results
    this network holds. The mechanism: to write an odd n as three primes, subtract a prime p just
    below n and apply the even verification to n - p, which is even and within x/Delta of zero
    distance -- so a verification to H covers odd numbers to about H*Delta. With Ramare and
    Saouter's intervals Delta is 28314000; with Kadiri and Lumley's it is 1966196911, giving odd
    Goldbach to about 7.86 x 10^27.
  authors: ["Terence Tao"]
  license: "Apache-2.0"
  responsible_maintainers: ["Terence Tao"]

repository:
  role: substantive-development

classification:
  arxiv: [math.NT]
  msc2020: ["11P32", "11N05"]

