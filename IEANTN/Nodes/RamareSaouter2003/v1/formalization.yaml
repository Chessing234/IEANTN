project:
  name: "Ramare and Saouter: short effective intervals containing primes"
  description: >-
    For every x above 10726905041 the interval (x(1 - 1/28314000), x] contains a prime. The width
    is a fixed proportion of x rather than x/(log x)^k, which is what makes the result usable in an
    induction that divides by a constant -- in particular in converting a verification of the even
    Goldbach conjecture into a range for the odd one.
  authors: ["Terence Tao"]
  license: "Apache-2.0"
  responsible_maintainers: ["Terence Tao"]

