# Node metadata for `OliveiraESilva2014.v1`.  See docs/NODES.md.
version: "v0.4"

node:
  id: OliveiraESilva2014.v1
  family: OliveiraESilva2014
  version: v1
  kind: computation
  status: active

project:
  name: "Oliveira e Silva, Herzog and Pardi's verification of the even Goldbach conjecture"
  description: >-
    Every even integer between 4 and 4 x 10^18 is a sum of two primes, verified by computation and
    published in 2014. This is the current record for the even Goldbach conjecture and the base
    case from which every finite odd-Goldbach range in this network is derived.
  authors: ["Terence Tao"]
  license: "Apache-2.0"
  responsible_maintainers: ["Terence Tao"]

repository:
  role: substantive-development

classification:
  arxiv: [math.NT]
  msc2020: ["11P32", "11Y11"]

conclusions:
- id: even_up_to_4e18
  declaration: OliveiraESilva2014.v1.even_up_to_4e18
  challenge: OliveiraESilva2014.v1.challenge_even_up_to_4e18
  imports: []
  imports_status: none
  justifications:
  - id: eshp-computation
    kind: numerical
    source: oliveira-e-silva-herzog-pardi
    locator: the paper's main verification, stated in its title and abstract
    note: >-
      A computation, not a proof. The paper reports an exhaustive verification over the even
      integers below 4 x 10^18, carried out on a distributed network of machines and checked twice
      with independent implementations. Nothing in this network checks it; it is recorded on the
      authority of the paper and of Mathematics of Computation.
  designated: eshp-computation

sources:
- title: "Empirical verification of the even Goldbach conjecture and computation of prime gaps up to 4 x 10^18"
  authors: ["Tomas Oliveira e Silva", "Siegfried Herzog", "Silvio Pardi"]
  type: "paper"
  id: "https://doi.org/10.1090/S0025-5718-2013-02787-1"
  location: "Math. Comp. 83 (2014), no. 288, 2033-2060"
  relationship: formalizes
  note: >-
    Authors, title, journal, volume and pages confirmed against Crossref, which lists the authors
    as Oliveira e Silva, Herzog and Pardi. This matters: PrimeNumberTheoremAnd's theorem name and
    blueprint text call the third author Piranian, which is wrong, though its own bibliography is
    correct. The paper is not held in this repository's library, so the statement is transcribed
    from PNT+'s transcription rather than read from the source.

related_formalizations:
- id: "https://github.com/AlexKontorovich/PrimeNumberTheoremAnd"
  relationship: builds-on
  note: >-
    PNT+ states this as `Goldbach.e_silva_herzog_piranian_goldbach`, with a `sorry`. It also proves
    an extension to 4 x 10^18 + 4 from the primality of 211, 313 and two nineteen-digit numbers,
    using Pocklington certificates from the external `PrimeCert` package. That extension is not
    stated here: the package is outside what a Comparator receipt admits, and the four extra
    integers buy about 8 x 10^9 out of 7.9 x 10^27 in the downstream odd-Goldbach range.

automation:
  methods:
  - method: agent
    models: ["Claude Opus 5 (Anthropic)"]
    framework: "Claude Code"
    role: >-
      Transcribed the statement and wrote this metadata under the direction of the maintainer, and
      confirmed the bibliographic record against Crossref, which is how the third author's name was
      corrected. The computation is the authors'.

review:
  status: self-assessed
  reviewers: ["Terence Tao"]
  notes: >-
    Statement taken from PNT+ rather than from the paper, which the library does not hold. The
    bibliographic record was checked against Crossref and one error in PNT+'s prose was found and
    is recorded above.

limitations:
- >-
  A computation recorded on citation. It cannot be rerun here and is checked by nothing in this
  network; a consumer trusts the authors and the referees of Math. Comp.
- >-
  The Goldbach half only. The paper's prime-gap computation below 4 x 10^18 is not stated, though
  it is the other half of its title and would be a natural second conclusion.
- >-
  The source is not in the library. docs/SOURCES.md records it as wanted; until then the statement
  rests on PNT+'s transcription.
