# Node metadata for `GammaAsymptotics.v2`.  See docs/NODES.md.
#
# Growth of Gamma and its logarithmic derivative -- textbook asymptotics Mathlib does not have.
# Named for the class: intended to grow, and a plausible eventual contribution to Mathlib.
version: "v0.4"

node:
  id: GammaAsymptotics.v2
  family: GammaAsymptotics
  version: v2
  kind: standard
  status: awaiting-verification

project:
  name: "Growth of the Gamma function and its logarithmic derivative"
  description: >-
    The digamma asymptotic psi(w) = log w + O(1/|w|), restricted to a horizontal strip: for each
    height H a constant depending on H bounds ||psi w - log w|| by C/||w|| whenever Re w >= 1 and
    |Im w| <= H. GammaAsymptotics.v1 states the same estimate on the whole half-plane and is
    retained, unproved, as the harder target; removing the height restriction means proving v1.
    The split exists because the strip is where the elementary argument reaches. v1's route --
    iterating the digamma recurrence out of a compact box -- controls Re w -> infinity at bounded
    height and says nothing as Im w -> infinity, so v1 was over-general in precisely the direction
    carrying the difficulty. Mathlib supplies nothing to close that: its Digamma file is sixty-four
    lines, and BohrMollerup's logGammaSeq is real-variable only.
    Every consumer so far wants only the strip. CH2.v1 evaluates psi at 1-s for s on a ladder whose
    every piece has |Im s| <= T.
  authors: ["Terence Tao"]
  license: "Apache-2.0"
  responsible_maintainers: ["Terence Tao"]

repository:
  role: substantive-development

classification:
  arxiv: [math.CA]
  msc2020: ["33B15", "41A60"]

conclusions:
- id: digamma_sub_log_isBigO_strip
  issue: 64
  declaration: GammaAsymptotics.v2.digamma_sub_log_isBigO_strip
  challenge: GammaAsymptotics.v2.challenge_digamma_sub_log_isBigO_strip
  imports: []
  imports_status: none
  justifications:
  - id: unjustified
    kind: none-yet
    note: >-
      Imports `none`, and that is a real none: w is universally quantified with every condition a
      hypothesis, so a Lean proof is the whole justification.
      THIS IS v1 WITH A HEIGHT RESTRICTION, and the restriction is the point. v1's recorded route --
      iterate digamma_apply_add_one from a compact box in Re w in [1,2] -- DOES NOT PROVE v1. It
      pushes rightward and controls Re w -> infinity at bounded height; it says nothing about
      w = 1 + it as t -> infinity, which no compact box reaches. That was noticed only when someone
      went to carry the route out.
      THE STRIP DOES NOT RESCUE THE ELEMENTARY ROUTE EITHER, and an earlier version of this note
      claimed it did. Writing w = u + n with Re u in [1,2], the recurrence gives
      psi(w) = psi(u) + sum_{j<n} 1/(u+j), and comparing that sum with the harmonic series leaves
      psi(w) - log w -> psi(u) + gamma + sum_{j>=0} (1/(u+j) - 1/(1+j)) =: kappa(u), a 1-periodic
      analytic function. Pinning kappa == 0 IS the Gauss representation. psi(1) = -gamma gives
      kappa(1) = 0 and periodicity spreads it to the integers and no further; the trigamma route
      meets the same obstruction one derivative down.
      SO THE REAL TARGET IS THE GAUSS/WEIERSTRASS SERIES,
      psi(u) = -gamma + sum_{k>=0} (1/(k+1) - 1/(k+u)), which Mathlib does not have and lists as a
      TODO in the file defining digamma. Once it exists v2 follows directly; v1 needs a further
      uniformity argument as Im w -> infinity. That series is the thing worth formalizing, and it
      is a Mathlib contribution in its own right rather than a step private to this repository.
      THE CONSTANT MAY DEPEND ON H AND MUST. A bound uniform in H is exactly v1.
  designated: unjustified
  progress:
    solution: Solutions/GammaAsymptotics.v2/
    state: in-progress
    remaining_holes: 0
sources:
- title: "The digamma asymptotic expansion"
  authors: ["folklore"]
  type: "folklore"
  id: "digamma-stirling"
  relationship: formalizes
  note: >-
    Standard material, in every reference on special functions; no particular source is followed and
    none is claimed. The `folklore` source type is used in the sense the schema allows rather than in
    the usual sense -- this is not an unproved fact circulating in the literature, it is a classical
    expansion that Mathlib has not got yet. What is specific to this node is the CHOICE of form: a
    half-plane rather than a sector, and an existential constant rather than a named one.

automation:
  methods:
  - method: agent
    models: ["Claude Opus 5 (Anthropic)"]
    framework: "Claude Code"
    role: >-
      Established that Mathlib carries no digamma growth bound, identified the statement CH2's
      ladder argument needs, and chose the form, under the direction of the maintainer. No proof is
      claimed.

review:
  status: self-assessed
  reviewers: ["Terence Tao"]
  notes: >-
    THE FORM WAS CHOSEN, NOT COPIED, and the choices are worth recording. The sharp statement is
    psi(w) = log w - 1/(2w) + O(1/w^2) on a sector |arg w| <= pi - delta. This node states the
    weaker O(1/|w|) on the half-plane Re w >= 1, for two reasons: the half-plane is what the
    applications use, and an explicit constant would invite the kind of numerology the node exists to
    avoid. A consumer wanting the -1/(2w) term, or the sector, should state that as a further
    conclusion here rather than sharpen this one -- they are different statements.
    What the applications actually consume is the corollary ||psi w|| <= ||log w|| + C, hence
    O(log|w|); that follows immediately and is not stated separately.
    Mathlib was checked rather than assumed, and RE-CHECKED after the bump, which moved it. On this
    repository's pin (mathlib 71a80585) Analysis/SpecialFunctions/Gamma/Digamma.lean is 153 lines
    and contains the definition, digamma_zero, digamma_one, digamma_one_half, digamma_apply_add_one,
    digamma_apply_add_nat, digamma_nat_add_one, Euler's reflection formula digamma_one_sub, the
    duplication formula digamma_two_mul, and meromorphic_digamma -- AND STILL NO BOUND OF ANY KIND,
    which is the half of the observation this node turns on. Gauss' integral representation remains
    a TODO in that file. Analysis/SpecialFunctions/Stirling.lean is about the factorial, not Gamma on
    the complex plane.
    WHEN FIRST WRITTEN THIS ENTRY SAID SIXTY-FOUR LINES AND LISTED FIVE THEOREMS. That was accurate
    then. It is recorded here rather than silently overwritten because the way it went stale is
    general: a Mathlib bump changes what the repository may assume, and prose claims about what
    Mathlib contains rot without any Lean file changing and without any check failing. Nothing in
    this repository verifies a sentence like the one above; only someone going to look does.

limitations:
- >-
  Stated but not proved. Nothing downstream may treat it as established, and CH2.v1's ladder
  bounds inherit that.
- >-
  ONE ASYMPTOTIC ONLY, and a weak one. The node is named for the class because it is intended to
  grow: the -1/(2w) term, the sector version, a bound on Gamma itself, and Stirling's formula in the
  complex plane are all wanted and none is here. A consumer needing any of them will not find it.
- >-
  THE CONSTANT IS EXISTENTIAL. A consumer needing an explicit numerical constant -- which an explicit
  estimate eventually will -- cannot get one from this statement and will need a sharper conclusion
  stated alongside it.
- >-
  Re w >= 1 excludes the left half-plane entirely, where digamma has its poles. An application that
  needs psi there must combine this with the reflection formula
  psi(1-w) - psi(w) = pi cot(pi w). THAT IS NOW AVAILABLE: this entry previously said it awaited a
  more recent Mathlib than this repository's pin, and the bump that brought it
  (leanprover-community/mathlib4#42349) has since happened, so it is Complex.digamma_one_sub on the
  current pin. But note the reflection formula alone proves nothing about growth, in either
  half-plane, so having it does not shorten the work below.
  CH2.v1 does not need the left half-plane: its ladder argument evaluates psi at 1-s with
  Re(1-s) >= 2, which is already inside the stated range.
- >-
  No novelty is claimed. The expansion is classical.
