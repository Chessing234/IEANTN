sources:
- title: "Elementary methods in the study of the distribution of prime numbers"
  authors: ["Harold G. Diamond"]
  type: "paper"
  id: "https://doi.org/10.1090/S0273-0979-1982-15057-1"
  location: "Bull. Amer. Math. Soc. (N.S.) 7 (1982), no. 3, 553-589"
  relationship: adapts
  note: >-
    The presentation followed here, rather than the origin of the result: Chebyshev's estimates
    date from 1852 and are textbook material. Diamond's survey is where the particular weight
    nu = e_1 - e_2 - e_3 - e_5 + e_30 and the resulting constant are set out in the form the proof
    uses. The constants stated here are not quoted from it; they are what the Lean proof produces.

related_formalizations:
- id: "https://github.com/AlexKontorovich/PrimeNumberTheoremAnd"
  relationship: builds-on
  note: >-
    PrimeNumberTheoremAnd/IEANTN/Chebyshev.lean is where this development comes from, and the
    solution is a port of it. Two things did not come across. Its log tables are proved by
    LeanCert's interval_decide, and its psi(x) <= 1.11 x needs a native_decide check over the
    integers up to 11723; both are outside the axiom set Comparator permits, so the solution
    reproves the log bounds from Mathlib and this node does not state the 1.11 bound.

automation:
  methods:
  - method: agent
    models: ["Claude Opus 5 (Anthropic)"]
    framework: "Claude Code"
    role: >-
      Ported the development from PrimeNumberTheoremAnd under the direction of the maintainer:
      transcribed the conclusions into this network's vocabulary, replaced the LeanCert-backed log
      tables with proofs from Mathlib's exponential bounds, and dropped the parts that rest on
      native_decide. The mathematics and the original Lean are from PNT+.

review:
  status: self-assessed
  reviewers: ["Terence Tao"]
  notes: >-
    The statements are transcribed from the PNT+ development rather than from Diamond, and differ
    from the blueprint text there in one place: PNT+'s blueprint states the lower bound with a
    -1 where its own Lean proves +5. The Lean is what is stated here, and it is the stronger of
    the two.

limitations:
- >-
  Bounded ranges. psi_lower and psi_upper say nothing below x = 30, and psi_le_small says nothing
  above it. Together they cover every x > 0, but a consumer wanting one statement across the whole
  range has to assemble it.
- >-
  psi_upper_clean is conditional, and the other four are not. It rests on ChebyshevNumerics.v1,
  which is a computation rather than a proof: PNT+ verifies the base case with native_decide, which
  Comparator does not admit. A consumer that wants an unconditional bound wants psi_upper, whose
  second term is of order (log x)^2, or psi_le_small below 30.
- >-
  No novelty is claimed. Chebyshev's estimates are from 1852; what is new here is only the Lean
  proof, and that is a port of PNT+'s.
