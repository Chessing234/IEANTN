# Node metadata for `Chebyshev.v1`.  See docs/NODES.md.
#
# The one node in the network that imports nothing and is meant to be proved rather than cited.
# Its `none` import status is a real none: Chebyshev's estimates need no zero-free region, no
# verification height and no zero-density input, which is exactly what makes them the floor the
# rest of the network stands on.
version: "v0.4"

node:
  id: Chebyshev.v1
  family: Chebyshev
  version: v1
  kind: paper
  status: awaiting-verification

project:
  name: "Chebyshev's elementary bounds on psi"
  description: >-
    The classical elementary estimates for the Chebyshev function psi(x), with explicit constants
    and no analytic input: psi(x) >= a x - 5 log x + 5 and psi(x) <= 6 a x / 5 +
    (log(x/5)/log 6)(5 log x - 5) for x >= 30, where a = (7/15) log 2 + (3/10) log 3 + (1/6) log 5
    = 0.9212920..., together with the numerical value of a and the small-range bound
    psi(x) <= 1.015 x for 0 < x <= 30. The argument is Chebyshev's, in the form Diamond's survey
    presents it: compare T(x) = sum_{n <= x} log n with its integral, rewrite it through
    log n = sum_{d | n} Lambda(d), and weight by nu = e_1 - e_2 - e_3 - e_5 + e_30, whose associated
    step function E takes only the values 0 and 1.
  authors: ["Terence Tao"]
  license: "Apache-2.0"
  responsible_maintainers: ["Terence Tao"]

repository:
  role: substantive-development

classification:
  arxiv: [math.NT]
  msc2020: ["11N05", "11A41"]

